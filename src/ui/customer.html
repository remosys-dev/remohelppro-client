<html>
    <head>
        <style>
            @import url(common.css);
            body { background: #f5f8fe; }
            div.page { size: *; padding: 18dip 24dip; flow: vertical; }
            div.title { font-size: 18dip; font-weight: bold; color: #1e40af; margin-bottom: 4dip; }
            div.sub { color: #6b7280; font-size: 12dip; margin-bottom: 14dip; }
            div.card { background: white; border: 1dip solid #c7d7fe; border-radius: 8dip; padding: 16dip; }
            input.code { font-size: 24dip; width: *; height: 44dip; text-align: center; letter-spacing: 4dip; }
            button.go { width: *; height: 40dip; margin-top: 12dip; font-size: 14dip; font-weight: bold;
                        background: #2563eb; color: white; border: none; border-radius: 6dip; }
            button.go:disabled { background: #93b4f5; }
            button.end { width: *; height: 36dip; margin-top: 12dip; font-size: 13dip;
                         background: white; color: #dc2626; border: 1dip solid #fca5a5; border-radius: 6dip; }
            div.err { color: #b91c1c; background: #fef2f2; padding: 8dip; margin-top: 10dip; border-radius: 6dip; }
            div.big { font-size: 16dip; font-weight: bold; text-align: center; margin: 6dip 0; }
            div.note { color: #374151; font-size: 12dip; text-align: center; }
            div.who { margin-top: 10dip; padding: 8dip; background: #eaf1fd; border-radius: 6dip; font-size: 12dip; }
            div.safe { margin-top: 14dip; color: #6b7280; font-size: 11dip; }
        </style>
        <script type="text/tiscript">
            include "common.tis";
            include "customer.tis";
        </script>
    </head>
    <body>
    </body>
</html>
