name: remohelppro Mac / Linux

# REMOHELP PRO の Mac版・Linux版クライアントをビルドする。
#   flutter-build.yml を windows_only / android_only を付けずに呼ぶと、
#   build-for-macOS（macos-14 = Apple Silicon / macos-15-intel = Intel）と
#   Linux のジョブが動く。Mac 実機も Apple との契約も無しでビルドできる。
#
#   ※署名は未設定（MACOS_P12_BASE64 が空）なので成果物は未署名。
#     顧客に配る場合、初回だけ「開発元を確認できません」の警告を回避する操作が要る。
#     警告なしで配るには Apple Developer Program（年 $99）が必要。
#
#   `mac-build-*` タグを push すると自動ビルド。
#
#   ⚠ 既定は **macOS だけ**（mac_only）。ゲートを付けずに flutter-build.yml を呼ぶと
#     Windows/Android/iOS/Linux まで全マトリクスが回り、1回で数時間分を消費する。
#     Linux も一緒に作りたいときだけ、手動実行で include_linux にチェックを入れる。
#     （Linux は res/DEBIAN/preinst の実行権限が squash で落ちており deb 化に失敗する。
#       製品スコープ外なので未修正）
on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: 'Linux 版も一緒にビルドする（既定は macOS のみ）'
        type: boolean
        default: false
  push:
    tags:
      - 'mac-build-*'

permissions:
  contents: write

jobs:
  build-mac-linux:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "mac"
      # タグ push では inputs が空なので !'' = true → macOS のみ。
      mac_only: ${{ !inputs.include_linux }}
