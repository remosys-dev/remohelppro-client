name: Android APK (only)

# REMOHELP PRO: Android APK だけをビルドする（分数節約）。
#   手動実行(workflow_dispatch) か、android-build-* タグ push で起動。
#   flutter-build.yml を android_only=true で呼び、Windows/iOS/macOS/Linux/appimage/flatpak を skip。
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-build-*'

# Release 公開ステップ（softprops/action-gh-release）が private repo で
# GITHUB_TOKEN の権限不足(403)にならないよう、呼び出し元で書き込み権限を付与。
permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      # 🔴🔴 ここは "android" 固定。触るときは必ず戻すこと（2026-08-14 に戻した）。
      #
      #   配布の同期スクリプト（remohelppro-sync-apps.sh）は
      #   リリースタグ "android" を1時間ごとに取り込み、
      #   /download/remohelppro-customer.apk を差し替える。
      #
      #   ⚠ 検証用に一時的に "android-test" へ逃がすことがある
      #     （枝 android-play-store で実際にそうしていた）。
      #     **master に取り込むときは必ずここへ戻す。**
      #     戻し忘れると、以後どれだけビルドしてもお客様には何も届かないのに、
      #     **ビルドは緑のまま**なので誰も気づけない。
      upload-tag: "android"
      android_only: true
