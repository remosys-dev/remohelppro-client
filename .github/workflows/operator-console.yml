name: Operator Console (WebView2)

# 2026-10-29: 相談員の専用プログラム（operator-console/）。WebView2 で /console を出す窓。
#   ⚠ 32ビット用（i686）の1個で 32/64 どちらの Windows にも入る（社長と合意）。
#   ⚠ 署名は別途（EV トークン保持者）。ここでは署名しない。
on:
  workflow_dispatch:
  push:
    tags:
      - 'console-build-*'

permissions:
  contents: read

env:
  VERSION: "1.0.${{ github.run_number }}"

jobs:
  build-console:
    name: i686-pc-windows-msvc (console)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: operator-console
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Bake version
        run: |
          sed -i "0,/^version = \"[0-9.]*\"/s//version = \"${{ env.VERSION }}\"/" Cargo.toml
          grep -q "^version = \"${{ env.VERSION }}\"" Cargo.toml || { echo "RL: 版を焼き込めませんでした"; exit 1; }

      - name: Build
        run: |
          set +e
          cargo build --release --target i686-pc-windows-msvc 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # ⚠ 記録はログインしないと読めないので、エラーを注記にも出す（最大10件）
            sed 's/\x1b\[[0-9;]*m//g' build.log | grep -A5 -E '^error' | head -60 | paste -sd '|' | fold -w 900 | head -10 | while read -r l; do
              echo "::error title=cargo::${l//%/%25}"; done
            exit 1
          fi
          mkdir -p ../ConsoleOut
          cp target/i686-pc-windows-msvc/release/remohelppro-console.exe ../ConsoleOut/remohelppro-console-${{ env.VERSION }}.exe
          # 32ビット用にできたか（PE の machine が 0x14c）
          python -c "import struct,sys;b=open(sys.argv[1],'rb').read();o=struct.unpack_from('<I',b,0x3c)[0];m=struct.unpack_from('<H',b,o+4)[0];print('machine',hex(m));sys.exit(0 if m==0x14c else 1)" ../ConsoleOut/remohelppro-console-${{ env.VERSION }}.exe
          ls -la ../ConsoleOut

      - name: Upload console exe (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-x86-unsigned
          path: ConsoleOut

      # 🔴 セットアップ（2026-10-30 社長の確定見本「1 インストール」の5画面）。Inno Setup で作る
      #   本番用（svr）と試験用（dev・別製品として入る）の2つ。⚠ ここでは署名しない
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Wizard images (blue band with the product name)
        shell: pwsh
        working-directory: operator-console/installer
        run: |
          Add-Type -AssemblyName System.Drawing
          function Band($w, $h, $path, $big) {
            $b = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.TextRenderingHint = 'AntiAliasGridFit'
            $r = New-Object System.Drawing.Rectangle 0, 0, $w, $h
            $br = New-Object System.Drawing.Drawing2D.LinearGradientBrush $r, ([System.Drawing.Color]::FromArgb(21,101,192)), ([System.Drawing.Color]::FromArgb(13,71,161)), 90
            $g.FillRectangle($br, $r)
            $white = [System.Drawing.Brushes]::White
            if ($big) {
              $g.DrawString('REMOHELP PRO', (New-Object System.Drawing.Font 'Yu Gothic UI', 15, ([System.Drawing.FontStyle]::Bold)), $white, 12, 24)
              $g.DrawString('相談員プログラム', (New-Object System.Drawing.Font 'Yu Gothic UI', 11), $white, 13, 56)
            } else {
              $g.DrawString('R', (New-Object System.Drawing.Font 'Segoe UI', 26, ([System.Drawing.FontStyle]::Bold)), $white, 8, 2)
            }
            $b.Save((Join-Path (Get-Location) $path), [System.Drawing.Imaging.ImageFormat]::Bmp)
          }
          Band 164 314 'wizard.bmp' $true
          Band 55 55 'wizard-small.bmp' $false
          Get-ChildItem *.bmp

      - name: Build setup (prod / dev)
        shell: pwsh
        working-directory: operator-console/installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $exe = (Resolve-Path "..\..\ConsoleOut\remohelppro-console-${{ env.VERSION }}.exe").Path
          & $iscc "/DAppVersion=${{ env.VERSION }}" "/DSrcExe=$exe" console.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=iscc::本番用のセットアップを作れませんでした"; exit 1 }
          & $iscc "/DAppVersion=${{ env.VERSION }}" "/DSrcExe=$exe" "/DDev=1" console.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=iscc::試験用のセットアップを作れませんでした"; exit 1 }
          Get-ChildItem ..\..\ConsoleOut

      - name: Upload setups (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-setup-unsigned
          path: ConsoleOut/*-setup-*.exe
