name: Win32 Customer (32bit sciter)

# 🔴 2026-10-29 追記：相談員の操作アプリ（ビュアー）の 32ビット版も同じ作りで出す（社長「既存のも32ビット対応はする」）。
#   タグ win32-op-build-* / win32-op-dev-build-*、または手動の kind=operator で相談員用になる。

# 2026-10-29: 32ビット版 Windows のお客様用アプリ（社長「32ビットにも対応したい。RemoHelp はどちらも入れる」）。
#   お客様用アプリの画面は Flutter で、Flutter は 32ビット Windows に対応していない。
#   RustDesk の古い画面（sciter）で i686 を組み立て、番号でつなぐ小さな窓（src/ui/customer.*・src/rl_customer.rs）を出す。
#   flutter-build.yml の build-for-windows-sciter を元に、お客様用（ワンタイム）の調整だけを足したもの。
#   ⚠ 署名は別途（EV トークン保持者）。ここでは署名しない。
on:
  workflow_dispatch:
    inputs:
      dev_server:
        description: '試験用（dev.remohelppro.jp 向け）に作る'
        type: boolean
        default: false
      kind:
        description: 'customer（お客様用）/ operator（相談員の操作アプリ）'
        type: choice
        options: [customer, operator]
        default: customer
  push:
    tags:
      - 'win32-build-*'       # このタグを push すると自動ビルド(git/SSHだけで起動可)
      - 'win32-dev-build-*'   # 🔴 試験用（開発機向け）。本番向けの版では開発機の番号は通らない（2026-10-29 実際に踏んだ）
      - 'win32-op-build-*'      # 相談員の操作アプリ（本番向け）
      - 'win32-op-dev-build-*'  # 相談員の操作アプリ（試験用）

permissions:
  contents: write

env:
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.${{ github.run_number }}"
  # ワンタイム版の有効期限（日数）。x64 のお客様用と同じ既定
  ONETIME_VALID_DAYS: "365"

jobs:
  build-win32-customer:
    name: i686-pc-windows-msvc (${{ (startsWith(github.ref_name, 'win32-op-') || inputs.kind == 'operator') && 'operator' || 'customer' }})
    runs-on: windows-2022
    env:
      # customer / operator。⚠ 以降の段はすべてこれで分ける
      RL_KIND: ${{ (startsWith(github.ref_name, 'win32-op-') || inputs.kind == 'operator') && 'operator' || 'customer' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: rustdesk-org/install-llvm-action-32bit@master
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2023-10-13-i686-pc-windows-msvc # abi_thiscall のため nightly
          targets: i686-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-sciter-customer

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x86-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Bake version and customer app name
        shell: bash
        run: |
          sed -i "0,/^version = \"[0-9.]*\"/s//version = \"${{ env.VERSION }}\"/" Cargo.toml
          sed -i "0,/^version = \"[0-9.]*\"/s//version = \"${{ env.VERSION }}\"/" libs/portable/Cargo.toml
          grep -q "^version = \"${{ env.VERSION }}\"" Cargo.toml || { echo "RL: 版を焼き込めませんでした"; exit 1; }
          # 相談員用は本体と同じアプリ名（remohelppro）のまま。⚠ スキーム remohelppro:// もこれで決まる
          if [ "$RL_KIND" = "operator" ]; then echo "RL: 相談員用（アプリ名 remohelppro のまま）"; exit 0; fi
          # お客様用（ワンタイム）と同じアプリ名。設定の置き場所・サービス名がこれから決まる
          sed -i 's/RwLock::new("remohelppro".to_owned())/RwLock::new("remohelppro-support".to_owned())/' libs/hbb_common/src/config.rs
          grep -q 'APP_NAME: RwLock<String> = RwLock::new("remohelppro-support".to_owned());' libs/hbb_common/src/config.rs || {
            echo "RL: お客様用のアプリ名を分けられませんでした"; exit 1; }

      # 🔴 試験用は接続先・鍵・管理サーバー・アプリ名を開発機向けに（flutter-build と同じ共通部品）。
      #   ⚠ アプリ名を remohelppro-support にした後に呼ぶ（-dev は真ん中に入る → remohelppro-dev-support）
      - name: 試験用サーバー向けに焼き込む（dev only）
        if: ${{ contains(github.ref_name, 'dev-build-') || inputs.dev_server }}
        uses: ./.github/actions/dev-bake

      - name: Build (sciter x86, customer window)
        shell: bash
        run: |
          # 🔴 お客様用はこれが無いと、番号でつなぐ窓ではなく元の画面が出る（rl_customer::is_customer_build）
          #   ⚠ 相談員用には付けない（相談員用は下の RL_SCITER_OPERATOR）
          if [ "$RL_KIND" = "customer" ]; then export RL_SCITER_CUSTOMER=1; fi
          # 相談員用は、元の画面ではなくインストールと案内だけの窓（rl_operator::is_operator_build）
          if [ "$RL_KIND" = "operator" ]; then export RL_SCITER_OPERATOR=1; fi
          APPBASE="${RL_APP_BASE:-}"
          if [ -z "$APPBASE" ]; then [ "$RL_KIND" = "operator" ] && APPBASE=remohelppro || APPBASE=remohelppro-support; fi
          echo "RL_APPBASE_FINAL=$APPBASE" >> "$GITHUB_ENV"
          # 🔴 窓の html/tis は英数字だけ（sciter が Shift_JIS で読み、日本語で真っ白になった 2026-10-29）
          if LC_ALL=C grep -nP '[^\x00-\x7F]' src/ui/customer.html src/ui/customer.tis src/ui/operator.html src/ui/operator.tis src/ui/common.tis src/ui/common.css; then
            echo "::error title=customer-ui::customer.html/tis に日本語などの英数字以外があります。文は rl_customer::texts_json へ"; exit 1
          fi
          python3 res/inline-sciter.py
          grep -q "_CUSTOMER" src/ui/inline.rs || { echo "RL: お客様用の窓を埋め込めませんでした"; exit 1; }
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          # ⚠ 失敗したら、エラーの行を注記にも出す（記録はログインしないと読めないが、注記は API で読める）
          set +e
          cargo build --features inline,vram,hwcodec --release --bins 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # ⚠ ここは pipefail を外す（head で途中を切ると grep が失敗扱いになり、注記を出す前に止まる）
            set +e +o pipefail
            # ⚠ 注記は1件が短く切られる。エラー1つずつ、場所の行と一緒に出す（最大10件）
            sed 's/\x1b\[[0-9;]*m//g' build.log > plain.log
            python3 .github/rl-cargo-errors.py plain.log
            exit 1
          fi
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/$APPBASE.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          test -s ./Release/sciter.dll || { echo "RL: sciter.dll を取れませんでした"; exit 1; }
          # 32ビットの VC++ 実行部品を同梱（入っていない PC がある・x64 のお客様用と同じ考え）
          cp /c/Windows/SysWOW64/vcruntime140.dll /c/Windows/SysWOW64/msvcp140.dll ./Release/ || true
          # ワンタイム版の目印（ランナーが使い終わったら自分ごと消す）。⚠ 相談員用には付けない（消えては困る）
          if [ "$RL_KIND" = "customer" ]; then echo "onetime" > ./Release/remohelppro-onetime.flag; fi
          ls -la ./Release

      - name: Upload unsigned inner files
        uses: actions/upload-artifact@v4
        with:
          name: win32-${{ env.RL_KIND }}-inner-unsigned
          path: Release

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          if [ "$RL_KIND" = "customer" ]; then
            export RL_ONETIME_EXPIRES_AT=$(( $(date -u +%s) + ${{ env.ONETIME_VALID_DAYS }} * 86400 ))
          fi
          # 試験用は dev-bake が RL_APP_BASE（remohelppro-dev-support / remohelppro-dev）を渡す
          export RL_APP_PREFIX="$RL_APPBASE_FINAL"
          pushd ./libs/portable
          pip3 install -r requirements.txt || { echo "::error title=packer::pip install failed"; exit 1; }
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/$RL_APPBASE_FINAL.exe > ../../gen.log 2>&1 || {
            echo "::error title=packer::generate.py failed: $(tail -8 ../../gen.log | paste -sd '|' | sed 's/%/%25/g')"; exit 1; }
          popd
          echo "::notice title=packer::$(find . -name 'rustdesk-portable-packer.exe' -not -path './.git/*' | paste -sd ' ')"
          mkdir -p ./SignOutput
          # ⚠ ls で探さない（片方が無いと ls が失敗し、pipefail で止まる）
          PACKER=""
          for f in ./target/release/rustdesk-portable-packer.exe ./target/i686-pc-windows-msvc/release/rustdesk-portable-packer.exe ./libs/portable/target/release/rustdesk-portable-packer.exe; do
            if [ -f "$f" ]; then PACKER="$f"; break; fi
          done
          test -n "$PACKER" || { echo "::error title=packer::自己展開ファイルが見つかりません"; exit 1; }
          KIND=""; [ -n "${RL_APP_BASE:-}" ] && KIND="-dev"
          mv "$PACKER" ./SignOutput/remohelppro-$RL_KIND-x86${KIND}-${{ env.VERSION }}.exe
          ls -la ./SignOutput

      - name: Upload customer x86 exe (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: win32-${{ env.RL_KIND }}-x86-unsigned
          path: SignOutput
