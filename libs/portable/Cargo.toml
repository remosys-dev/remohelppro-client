[package]
name = "rustdesk-portable-packer"
version = "1.4.6"
edition = "2021"
description = "REMOHELP PRO Remote Desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"

[dependencies]
brotli = "3.4"
dirs = "5.0"
md5 = "0.7"
# winuser は MessageBoxW / AllowSetForegroundWindow で使う。
#   これまで native-windows-gui 経由で有効になっていただけで、依存が変わると
#   静かにコンパイルが通らなくなるため明示する。
#   synchapi / handleapi / errhandlingapi は「二重に起動させない」ための名前付き錠に使う
#   （2026-08-28 ご指摘。落としてきた物を2回開くと2つ動き、接続番号を奪い合っていた）。
#   ⚠ ビルド用の依存にしか入っていなかったので、本体側にも明示する。
#   processthreadsapi / winnt は「その窓を持っているのが当社のワンタイム版か」を
#   確かめるために使う（OpenProcess / QueryFullProcessImageNameW）。
#   ⚠ 2026-08-29: 窓の種類だけで探して**他製品の窓を前に出していた**ため追加。
winapi = { version = "0.3", features = [
    "winbase",
    "winuser",
    "synchapi",
    "handleapi",
    "errhandlingapi",
    "processthreadsapi",
    "winnt",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32",
    "Win32_System",
    "Win32_System_SystemInformation",
] }
native-windows-gui = {version = "1.0", default-features = false, features = ["animation-timer", "image-decoder"]}

[package.metadata.winres]
LegalCopyright = "Copyright © 2026 Remosys Inc. All rights reserved."
ProductName = "REMOHELP PRO"
OriginalFilename = "rustdesk.exe"
FileDescription = "REMOHELP PRO Remote Desktop"
CompanyName = "株式会社リモシス"
#ProductVersion = ""

[target.'cfg(target_os="windows")'.build-dependencies]
winres = "0.1"
winapi = { version = "0.3", features = [ "winnt", "pdh", "synchapi" ] }


