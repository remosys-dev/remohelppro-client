[package]
name = "remohelppro-launcher"
version = "0.1.0"
edition = "2021"

# 相談員プログラムのランチャー（autorun 相当）。
#   起動時に版を確認し、新しければ入れ替えてから本体を起動する。
#   本体を実行中に上書きすることは Windows ではできないため、
#   本体が動いていない「起動前」に差し替えるこの形が確実。

[[bin]]
name = "remohelppro-launcher"
path = "src/main.rs"

[dependencies]
ureq = { version = "2.9", features = ["json", "tls"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winuser", "processthreadsapi"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
